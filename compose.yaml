services:
  gateway:
    build:
      context: .
      target: runtime
    init: true
    restart: unless-stopped
    stop_grace_period: 10s
    cpus: "1.0"
    mem_limit: 512m
    pids_limit: 128
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:${BRAIN_PORT:-8080}:8080"
    environment:
      BRAIN_ROOT: /app/brain
      BRAIN_DB_PATH: /app/data/brain.db
      BRAIN_API_TOKENS: ${BRAIN_API_TOKENS:?configure BRAIN_API_TOKENS in .env}
    volumes:
      - ./brain:/app/brain:ro
      - ./brain/proposals:/app/brain/proposals
      - brain-data:/app/data
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  brain-data:
