services:
  gateway:
    build:
      context: .
      target: runtime
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:${BRAIN_PORT:-8080}:8080"
    environment:
      BRAIN_ROOT: /app/brain
      BRAIN_DB_PATH: /app/data/brain.db
      BRAIN_API_TOKENS: ${BRAIN_API_TOKENS:?configure BRAIN_API_TOKENS in .env}
    volumes:
      - ./brain:/app/brain
      - brain-data:/app/data
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m

volumes:
  brain-data:
